name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  # Lower case, because it is what you type. Matches release.sh and the app-id.
  BIN_NAME: oket

# Linux only, deliberately. The PTY layer is POSIX (forkpty vs ConPTY is two
# implementations, not one with a flag), so Windows and macOS wait for that work.

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # release.sh --local is what a developer runs, so the layout a release ships and the
      # layout you build on your own machine cannot drift. It builds the kernel AND every
      # plugin: a release without them is an editor with no editor in it.
      - name: Build
        run: ./release.sh --local --version "${{ inputs.version }}" --tarball

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: dist

      # Two assets. The tarball is what oket NEEDS to run — the binary alone has no plugins, so
      # it has no editor, no browser and no syntax. `.tar.gz` and not `.zip` because tar is on
      # every machine that has curl, and unzip is not.
      #
      # install.sh rides along raw: the curl one-liner fetches it by name, and a script inside
      # the archive it is supposed to download would be a circle.
      #
      # This job never checks out, so gh has no remote to infer the repo from: GH_REPO
      # supplies it, and --target pins the tag to the dispatched commit.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$VERSION" \
              dist/*.tar.gz dist/install.sh \
              --target "${{ github.sha }}" \
              --title "$VERSION" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
