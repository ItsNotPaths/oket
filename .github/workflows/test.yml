name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # A cap this loose only ever catches a hang, and a hung parallel test otherwise burns a
    # runner until the 6-hour default gives up.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Same -L as the release step below: the bindings say `system:SDL3`, and the vendored
      # libSDL3.a is the only SDL3 the runner has.
      - name: Test
        run: odin test src/tests -extra-linker-flags:"-Lvendor/sdl3"

      # -o:speed changes what the optimiser folds; a clean debug compile does not prove
      # the release build.
      - name: Build (release settings)
        run: |
          odin build src/oket -out:oket -o:speed -extra-linker-flags:"-Lvendor/sdl3"
